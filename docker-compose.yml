services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: travel_agent
      POSTGRES_PASSWORD: travel_agent_dev_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./travel-recomend-backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent -d travel_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./travel-recomend-backend
    env_file: ./travel-recomend-backend/.env
    environment: { PORT: 3300, SESSIONS_FILE: /data/sessions.json, DATABASE_URL: postgresql://travel_agent:travel_agent_dev_only@postgres:5432/travel_agent }
    volumes: [travel-data:/data]
    expose: ["3300"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./travel-recomend-front
    ports: ["5173:80"]
    depends_on: { backend: { condition: service_healthy } }
volumes: { travel-data: {}, postgres-data: {} }
